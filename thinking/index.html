<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Prototype Festival project by Jinhang Xiao">

    <link rel="shortcut icon" type="image/svg+xml" href="../favicon-green-square.svg">

    <link rel="icon" type="image/svg+xml" sizes="32x32" href="../favicon-green-square.svg">

    <link rel="stylesheet" href="../cursor/cursor.css">
    <link rel="stylesheet" href="../motion.css">
    <script src="../motion.js" defer></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            font-size: 11.2px;
            line-height: 1.4;
            color: #000;
            background-color: #fff;
        }

        body::-webkit-scrollbar {
            width: 0px;
            background: transparent;
        }

        body::-webkit-scrollbar-thumb {
            background: transparent;
        }

        html {
            scrollbar-width: none;
        }

        h1 {
            font-weight: normal;
            font-size: 12.4px;
            display: inline;
        }

        h1 a {
            color: #000;
            text-decoration: none;
            cursor: var(--cursor-link, pointer);
        }

        h1 a:hover {
            text-decoration: underline;
        }

        a {
            color: #000;
            text-decoration: none;
            cursor: var(--cursor-link, pointer);
        }

        a:hover {
            text-decoration: underline;
        }

        img {
            max-width: 100%;
            height: auto;
            display: block;
            margin: 0;
            padding: 0;
            vertical-align: top;
        }

        .container {
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: 208px;
            border-right: 1px solid #000;
            padding: 16px;
            position: fixed;
            height: 100vh;
            overflow-y: auto;
            background-color: #fff;
            transition: transform 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            transform: translateX(-100%);
            z-index: 100;
        }

        .sidebar.show {
            transform: translateX(0);
        }

        .content {
            flex: 1;
            margin-left: 208px;
            padding: 16px;
            transition: margin-left 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            background: transparent;
        }

        .content .project-images img,
        .content .project-images video,
        .content .project-images > div {
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94), 
                        transform 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            will-change: opacity, transform;
        }

        .content .project-images img.show,
        .content .project-images video.show,
        .content .project-images > div.show {
            opacity: 1;
            transform: translateY(0);
        }

        .sidebar::-webkit-scrollbar {
            width: 0px;
            background: transparent;
        }

        .sidebar::-webkit-scrollbar-thumb {
            background: transparent;
        }

        .sidebar {
            scrollbar-width: none;
        }

        .bio {
            margin-bottom: 24px;
            position: relative;
        }

        .bio p {
            font-size: 12px;
            margin: 0;
            line-height: 1.4;
        }

        .bio h1 {
            position: relative;
            display: inline-block;
        }

        .bio h1::after {
            content: '';
            position: absolute;
            left: 0;
            right: 0;
            bottom: calc(-0.15em + 3px);
            height: 0.65em;
            background: #00ff88;
            z-index: -1;
        }

        .project-meta {
            font-size: 11.2px;
            margin: 12px 0 0 0;
            line-height: 1.4;
            color: #000;
            opacity: 0.4;
        }

        .school-link {
            text-decoration: underline;
        }

        .school-link:hover {
            text-decoration: none;
        }

        .back-link {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #fff;
            border: 1px solid #000;
            padding: 8px 16px;
            font-size: 10.4px;
            z-index: 1001;
            text-decoration: none;
            color: #000;
            transition: all 0.3s ease;
            user-select: none;
            border-radius: 0;
            min-width: 120px;
            text-align: center;
        }

        .back-link::after {
            content: '';
            position: absolute;
            left: 0;
            right: 0;
            bottom: 6px;
            height: 0;
            background: #00ff88;
            z-index: -1;
            transition: height 0.3s ease;
        }

        .back-link:hover::after {
            height: 8px;
        }

        .back-link:hover {
            color: #000;
            background: #fff;
            border-color: transparent;
            text-decoration: none;
        }

        .project-navigation {
            display: flex;
            justify-content: space-between;
            width: 100%;
            margin-top: 40px;
            padding: 0;
            line-height: normal;
        }

        .project-nav-btn {
            background: #fff;
            border: 1px solid #000;
            padding: 8px 16px;
            font-size: 10.4px;
            text-decoration: none;
            color: #000;
            position: relative;
            cursor: var(--cursor-link, pointer);
            transition: all 0.3s ease;
        }

        .project-nav-btn::after {
            content: '';
            position: absolute;
            left: 0;
            right: 0;
            bottom: 6px;
            height: 0;
            background: #00ff88;
            z-index: -1;
            transition: height 0.3s ease;
        }

        .project-nav-btn:hover::after {
            height: 8px;
        }

        .project-nav-btn:hover {
            color: #000;
            background: #fff;
            border-color: transparent;
            text-decoration: none;
        }

        .project-nav-btn.disabled {

        }

        @media (max-width: 768px) {
            .sidebar {
                width: 100%;
                position: relative;
                height: auto;
                border-right: none;
                border-bottom: 1px solid #000;
            }

            .content {
                margin-left: 0;
            }

            .container {
                flex-direction: column;
            }

            .bio p {
                font-size: 11px;
            }

            .project-meta {
                font-size: 11px;
            }

            .back-link {
                position: relative;
                top: auto;
                right: auto;

            }
        }

        @media (max-width: 480px) {
            .sidebar {
                padding: 12px;
            }

            .content {
                padding: 12px;
            }

            .bio p {
                font-size: 10px;
            }

            .project-meta {
                font-size: 10px;
            }
        }

        @media (max-width: 360px) {
            .sidebar {
                padding: 8px;
            }

            .content {
                padding: 8px;
            }

            .bio p {
                font-size: 9px;
            }
        }
    
        /* ---- Thinking: a flight through a space of notes ----
           The page scrolls, but nothing moves up or down: scrolling moves a camera forward. The
           sentence and the six notes sit one behind another in depth; each arrives from far away,
           stops in front of you, and flies past as you go on. Pixel dust fills the space and
           streams by as you travel. */
        html {
            scroll-snap-type: y mandatory;
            overflow-y: auto;
            height: auto;
        }

        body {
            overflow: visible;
            height: auto;
            min-height: 0;
        }

        #stars {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            image-rendering: pixelated;
            z-index: 0;
            pointer-events: none;
        }

        .track {
            position: relative;
            z-index: 0;
        }

        .stop {
            height: 100vh;
            scroll-snap-align: start;
            scroll-snap-stop: always;
        }

        .stage {
            position: fixed;
            inset: 0;
            z-index: 1;
            overflow: hidden;
            pointer-events: none;
        }

        /* on this page the way back stays pinned in the corner at every screen size (on the project
           pages it drops into the flow on small screens; here nothing flows) */
        .back-link {
            position: fixed;
            top: 16px;
            right: 16px;
            margin: 0;
        }

        .page-title {
            position: fixed;
            left: 16px;
            top: 16px;
            z-index: 10;
            margin: 0;
            font-size: 12.4px;
            font-weight: normal;
        }

        .page-title span {
            position: relative;
            display: inline-block;
        }

        /* everything in the space is placed from the centre of the window by the script */
        .hub,
        .thought {
            position: absolute;
            left: 50%;
            top: 50%;
            opacity: 0;
            will-change: transform, opacity;
        }

        .hub {
            text-align: center;
        }

        .hub p {
            font-size: 12.4px;
            line-height: 1.35;
            margin: 0;
            white-space: nowrap;
        }

        .hub .hub-meta {
            margin-top: 10px;
            font-size: 10.4px;
            color: #8a8a84;
        }

        .thought {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 2px;
            width: 250px;
            max-width: 78vw;
            padding: 0;
            border: 0;
            background: none;
            font: inherit;
            font-size: 12.4px;
            color: #000;
            text-align: left;
            cursor: var(--cursor-link, pointer);
        }

        .thought.is-on {
            cursor: var(--cursor-dot, default);
        }

        .thought canvas {
            width: 64px;
            height: 64px;
            image-rendering: pixelated;
        }

        .thought-label {
            position: relative;
            display: inline-block;
            white-space: nowrap;
        }

        .thought i {
            font-style: normal;
            margin-right: 10px;
        }

        .thought.is-on .doodle-hl::after {
            clip-path: inset(0);
            animation: hl-in 0.28s steps(4, end);
        }

        .thought:focus-visible {
            outline: 1px dashed #000;
            outline-offset: 6px;
        }

        /* The text unfolds when a note has arrived, and folds away slowly as you leave it.
           Both happen in steps, like the rest of the doodles. */
        .thought-body {
            display: grid;
            grid-template-rows: 0fr;
            transition: grid-template-rows 1.1s steps(11, end);
        }

        .thought-body > span {
            overflow: hidden;
            min-height: 0;
            font-size: 12.4px;
            line-height: 1.6;
            opacity: 0;
            transition: opacity 0.7s steps(5, end);
        }

        .thought.is-on .thought-body {
            grid-template-rows: 1fr;
            transition: grid-template-rows 0.36s steps(6, end) 0.15s;
        }

        .thought.is-on .thought-body > span {
            padding-top: 8px;
            opacity: 1;
            transition: opacity 0.3s steps(3, end) 0.25s;
        }

        /* The overview at the end behaves like a still page: notes are grey and folded until you
           point at one. Nothing moves when you do, so the pointer never loses it. */
        .is-overview .thought {
            cursor: var(--cursor-link, pointer);
        }

        .is-overview .thought canvas,
        .is-overview .thought-label {
            opacity: 0.4;
        }

        .is-overview .thought:hover,
        .is-overview .thought.is-on,
        .is-overview .thought:focus-visible {
            z-index: 5;
        }

        .is-overview .thought:hover canvas,
        .is-overview .thought:hover .thought-label,
        .is-overview .thought.is-on canvas,
        .is-overview .thought.is-on .thought-label,
        .is-overview .thought:focus-visible canvas,
        .is-overview .thought:focus-visible .thought-label {
            opacity: 1;
        }

        .is-overview .thought:hover .doodle-hl::after,
        .is-overview .thought:focus-visible .doodle-hl::after {
            clip-path: inset(0);
            animation: hl-in 0.28s steps(4, end);
        }

        .is-overview .thought-body {
            background: #fff;
            transition: grid-template-rows 1.3s steps(13, end) 0.25s;
        }

        .is-overview .thought-body > span {
            transition: opacity 0.9s steps(6, end) 0.25s;
        }

        .is-overview .thought:hover .thought-body,
        .is-overview .thought.is-on .thought-body,
        .is-overview .thought:focus-visible .thought-body {
            grid-template-rows: 1fr;
            transition: grid-template-rows 0.36s steps(6, end);
        }

        .is-overview .thought:hover .thought-body > span,
        .is-overview .thought.is-on .thought-body > span,
        .is-overview .thought:focus-visible .thought-body > span {
            padding-top: 8px;
            opacity: 1;
            transition: opacity 0.3s steps(3, end) 0.1s;
        }

        /* where you are: seven pixel squares, the current one filled */
        .stops {
            position: fixed;
            left: 50%;
            bottom: 18px;
            transform: translateX(-50%);
            z-index: 10;
            display: flex;
            gap: 4px;
        }

        .stops button {
            width: 20px;
            height: 20px;
            padding: 7px;
            border: 0;
            background: none;
            cursor: var(--cursor-link, pointer);
        }

        .stops button::before {
            content: '';
            display: block;
            width: 6px;
            height: 6px;
            outline: 1px solid #000;
            background: #fff;
        }

        .stops button.is-here::before {
            background: #00ff88;
        }

        .hint {
            position: fixed;
            left: 50%;
            bottom: 46px;
            transform: translateX(-50%);
            z-index: 10;
            margin: 0;
            font-size: 10.4px;
            color: #8a8a84;
            transition: opacity 0.4s steps(4, end);
        }

        .hint.is-gone {
            opacity: 0;
        }

        /* one jump straight through the whole space to the last stop, where all six sit together */
        .skip {
            position: fixed;
            right: 16px;
            bottom: 16px;
            z-index: 10;
            padding: 4px 0;
            border: 0;
            background: none;
            font: inherit;
            font-size: 12.4px;
            color: #000;
            cursor: var(--cursor-link, pointer);
            transition: opacity 0.3s steps(3, end);
        }

        .skip span {
            position: relative;
            display: inline-block;
        }

        .skip:hover .doodle-hl::after,
        .skip:focus-visible .doodle-hl::after {
            clip-path: inset(0);
            animation: hl-in 0.28s steps(4, end);
        }

        .skip.is-gone {
            opacity: 0;
            pointer-events: none;
        }

        /* the last dot stands for the overview: four small squares instead of one */
        .stops button.is-all::before {
            width: 2px;
            height: 2px;
            outline: 0;
            background: #000;
            box-shadow: 4px 0 0 #000, 0 4px 0 #000, 4px 4px 0 #000;
        }

        .stops button.is-all.is-here::before {
            background: #00ff88;
            box-shadow: 4px 0 0 #00ff88, 0 4px 0 #00ff88, 4px 4px 0 #00ff88;
            outline: 0;
        }

        /* phones: smaller way back, and the skip sits above the row of dots instead of beside it */
        @media (max-width: 700px) {
            .back-link {
                min-width: 0;
                padding: 6px 12px;
            }

            .hint {
                bottom: 76px;
            }

            .skip {
                right: auto;
                left: 50%;
                bottom: 42px;
                transform: translateX(-50%);
            }

            .stops {
                bottom: 12px;
            }

            .thought canvas {
                width: 52px;
                height: 52px;
            }
        }
    </style>
    <script src="../no-copy.js"></script>
</head>
<body>
    <canvas id="stars" aria-hidden="true"></canvas>
    <a href="../index.html" class="back-link">Back to Main</a>
    <h1 class="page-title"><span class="doodle-hl is-on">Thinking</span></h1>

    <!-- one screen of scrolling per stop; the stage itself never moves -->
    <div class="track" id="track" aria-hidden="true">
        <div class="stop"></div><div class="stop"></div><div class="stop"></div><div class="stop"></div><div class="stop"></div><div class="stop"></div><div class="stop"></div><div class="stop"></div>
    </div>

    <main class="stage" id="stage">
        <div class="hub" data-stop="0">
            <p>Six things I keep coming back to<br>when I design.</p>
            <p class="hub-meta">Notes to myself as much as to anyone else · 2026</p>
        </div>
            <button class="thought" type="button" data-id="conditions" data-stop="1">
                <canvas width="64" height="64" aria-hidden="true"></canvas>
                <span class="thought-label doodle-hl"><i>01</i>Rules before shapes</span>
                <span class="thought-body"><span>A form is one answer. A rule is a way of getting many. When I am stuck on how something should look, I go back and ask what it is allowed to do, what it must never do, and what happens at its edges. The shape usually follows.</span></span>
            </button>
            <button class="thought" type="button" data-id="type" data-stop="2">
                <canvas width="64" height="64" aria-hidden="true"></canvas>
                <span class="thought-label doodle-hl"><i>02</i>Words are the interface</span>
                <span class="thought-body"><span>Most of what people do with a product is read it. I write the words early, in the voice the product should speak in, and let layout and components grow around them. If the sentence is wrong, no amount of visual work makes the screen right.</span></span>
            </button>
            <button class="thought" type="button" data-id="pacing" data-stop="3">
                <canvas width="64" height="64" aria-hidden="true"></canvas>
                <span class="thought-label doodle-hl"><i>03</i>Pacing before polish</span>
                <span class="thought-body"><span>A flow has a rhythm before it has a look: what comes first, where it slows down, where it asks for something. I work that out in rough frames while it is still cheap to change. A well-drawn screen in the wrong order is still in the wrong order.</span></span>
            </button>
            <button class="thought" type="button" data-id="sync" data-stop="4">
                <canvas width="64" height="64" aria-hidden="true"></canvas>
                <span class="thought-label doodle-hl"><i>04</i>Make it to find out</span>
                <span class="thought-body"><span>I trust a prototype more than an argument. Building the thing, even badly, tells me in an hour what a week of discussion will not: whether it feels right in the hand, and what I forgot to design.</span></span>
            </button>
            <button class="thought" type="button" data-id="introduce" data-stop="5">
                <canvas width="64" height="64" aria-hidden="true"></canvas>
                <span class="thought-label doodle-hl"><i>05</i>Meet first, ask later</span>
                <span class="thought-body"><span>The first minutes with a product should feel like meeting something, not filling something in. I look at what a person gets before anything is asked of them, and I move every request as late as it can go.</span></span>
            </button>
            <button class="thought" type="button" data-id="loop" data-stop="6">
                <canvas width="64" height="64" aria-hidden="true"></canvas>
                <span class="thought-label doodle-hl"><i>06</i>Leave it open</span>
                <span class="thought-body"><span>I like work that can be picked up again: by me, by a teammate, by the person using it. So I try to end with something others can extend, such as a system, a tool, or a clear note on what comes next, and not only a finished picture.</span></span>
            </button>
    </main>

    <p class="hint" id="hint">scroll to travel</p>
    <button class="skip" id="skip" type="button"><span class="doodle-hl">skip to all six</span></button>
    <nav class="stops" id="stops" aria-label="Notes"></nav>

    <script>
        const THOUGHTS = ["conditions", "type", "pacing", "sync", "introduce", "loop"];

        // The flight. One screen of scrolling moves the camera one stop forward. Each thing in the
        // space is drawn at scale F / distance, from a vanishing point at the centre of the window,
        // so it grows as it approaches, is exactly life-size when you stop at it, and slides out
        // past the edge of the window as you go on.
        (function() {
            const canvas = document.getElementById('stars');
            const ctx = canvas.getContext('2d');
            const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
            const F = 500;                                    // distance at which a thing is life-size
            const GAP = 1400;                                 // depth between two stops
            const things = Array.prototype.slice.call(document.querySelectorAll('#stage [data-stop]')).map(function(el) {
                return { el: el, n: +el.dataset.stop, on: false };
            });
            // where each note sits when you have stopped at it, as a fraction of the window:
            // alternately left and right of the centre line, so they pass on either side of you
            const SPOTS = [[0, 0], [-0.2, -0.05], [0.16, 0.03], [-0.17, 0.06], [0.19, -0.06], [-0.15, 0.02], [0.14, 0.05]];
            // The last stop is the overview: the sentence in the middle and the six notes scattered
            // around it, folded, exactly as a still page. There a note unfolds when you point at it,
            // folds away slowly when you leave, and a click pins it open.
            const LAST = things.length;                       // index of the overview stop
            const slot = function(n) {                        // top-left corner of each thing, as a fraction of the window
                if (W >= 900) return [[0.5, 0.44], [0.07, 0.11], [0.39, 0.07], [0.71, 0.15], [0.64, 0.6], [0.33, 0.66], [0.05, 0.45]][n];
                // narrow windows: the sentence under the title, then the six in a single column
                if (n === 0) return [0.5, Math.max(0.11, 92 / H)];
                // fit the six between the sentence and the row of dots, whatever the height of the window
                // (a phone's browser toolbars can take a fifth of it)
                const first = 150, last = H - 62 - 74, step = Math.min(100, (last - first) / 5);
                return [0.08, (first + (n - 1) * step) / H];
            };
            let pinned = 0;                                   // the note clicked open in the overview (0 = none)
            let warp = null;                                  // the skip: a timed run straight to the end
            let W = 0, H = 0;
            const size = function() { W = canvas.width = innerWidth; H = canvas.height = innerHeight; };
            // One stop of scrolling is the height of a .stop element. That is NOT always innerHeight:
            // on phones 100vh is the height with the browser's toolbars hidden, while innerHeight is
            // the height that is visible right now, so always measure the element itself.
            const firstStop = document.querySelector('.stop');
            const stopH = function() { return firstStop.offsetHeight || innerHeight; };
            size();
            window.addEventListener('resize', size);

            let seed = 41;
            const rnd = function() { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
            const RANGE = 2600, NEAR = 60;
            const stars = [];
            for (let i = 0; i < 220; i++) stars.push({ x: (rnd() - 0.5) * 4200, y: (rnd() - 0.5) * 3000, z: rnd() * RANGE, green: rnd() < 0.05 });

            let cam = -900, target = 0, drift = 0, vel = 0;   // arrive from a little way back
            let mx = 0, my = 0, cx = 0, cy = 0, hovering = false;
            window.addEventListener('pointermove', function(e) {
                if (hovering) return;                             // hold the view still while a note is under the pointer
                mx = e.clientX / innerWidth * 2 - 1; my = e.clientY / innerHeight * 2 - 1;
            });
            const stage = document.getElementById('stage');
            stage.addEventListener('pointerover', function(e) { hovering = !!e.target.closest('.thought'); });
            stage.addEventListener('pointerout', function() { hovering = false; });

            const stopsNav = document.getElementById('stops');
            const hint = document.getElementById('hint');
            things.forEach(function(th) {
                const b = document.createElement('button');
                b.type = 'button';
                b.setAttribute('aria-label', th.n === 0 ? 'Start' : 'Note ' + th.n);
                b.addEventListener('click', function() { goTo(th.n); });
                stopsNav.appendChild(b);

                const green = function(pts, howMuch) {
                    ctx.fillStyle = '#00ff88';
                    const upto = Math.round(howMuch * pts.length);
                    for (let i = 0; i < upto; i++) {
                        const k = wob(i, frame + 5);
                        ctx.fillRect(Math.round(pts[i].x) + k[0] - 2, Math.round(pts[i].y) + k[1] - 2, 4, 4);
                    }
                };
                const icon = { btn: btn, t: 0, was: false };
                icon.step = function() {
                    const on = btn.matches(':hover, :focus-visible, .is-on') && btn.style.visibility !== 'hidden';
                    if (on) {
                        icon.t++;
                        // looping doodles go round again; the others stop on their last frame
                        if (d.loop && icon.t > (d.hold || 0) + d.loop) icon.t = (d.hold || 0) + 1;
                        else if (!d.loop && icon.t > d.max) icon.t = d.max;
                    } else if (icon.t > 0) {
                        if (icon.was) icon.t = Math.min(icon.t, d.max);      // leave from a frame near the start
                        icon.t = Math.max(0, icon.t - 2);                    // and run back twice as fast
                    }
                    icon.was = on;
                    ctx.clearRect(0, 0, 64, 64);
                    d.draw(icon.t, ink, green);
                };
                icons.push(icon);
            });
            const tick = function() { icons.forEach(function(icon) { icon.step(); }); };
            tick();
            if (!reduce) setInterval(function() { if (!document.hidden) { frame = (frame + 1) % 3; tick(); } }, 120);

        })();
    </script>
</body>
</html>
